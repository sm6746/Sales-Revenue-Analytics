- type: PYTHON
  name: plot_monthly_profit_margin_trends
  uuid: cd5da21c-f94f-46aa-a841-1bd924a7123f
  source: |-
    import pandas as pd
    import altair as alt

    # Calculate monthly profit and revenue
    monthly_profit_margin = (
        df_cleaned.groupby(["Year", "Month"])
        .agg(Total_Profit=("Profit", "sum"), Total_Revenue=("Amount", "sum"))
        .reset_index()
    )

    # Calculate the profit margin for each month
    monthly_profit_margin["Profit_Margin"] = (
        monthly_profit_margin["Total_Profit"] / monthly_profit_margin["Total_Revenue"]
    ) * 100

    # Create a 'Date' column for proper time-series plotting
    monthly_profit_margin["Date"] = pd.to_datetime(
        monthly_profit_margin[["Year", "Month"]].assign(day=1)
    )

    # Create the line chart to show the trend of monthly profit margin
    profit_margin_trend_chart = (
        alt.Chart(monthly_profit_margin)
        .mark_line(point=True)
        .encode(
            x=alt.X("Date:T", title="Month"),
            y=alt.Y("Profit_Margin:Q", title="Profit Margin (%)"),
            tooltip=["Date:T", "Profit_Margin:Q"],
        )
        .properties(title="Monthly Profit Margin Trend")
    )

    display(profit_margin_trend_chart)
  configuration:
    conditional_formatting: null
    title: null
    description: null
- type: PYTHON
  name: plot_yearly_sales
  uuid: c237d42b-4ec2-4b99-bf4f-355b6eef615e
  source: |-
    import altair as alt
    import pandas as pd

    # Group data by year to analyze yearly sales performance
    yearly_sales = df_cleaned.groupby("Year")["Amount"].sum().reset_index()

    # Create a bar chart to visualize yearly sales performance
    chart = (
        alt.Chart(yearly_sales)
        .mark_bar()
        .encode(
            x=alt.X("Year:O", title="Year"),
            y=alt.Y("Amount:Q", title="Total Sales"),
            tooltip=["Year", "Amount"],
        )
        .properties(title="Yearly Sales Performance")
    )

    display(chart)
  configuration: {}
- type: PYTHON
  name: plot_regional_contribution
  uuid: da8057bd-6d63-48b7-8cd1-a7ae971b6266
  source: |-
    import altair as alt

    # Group data by state to analyze region-wise performance
    region_performance = df_cleaned.groupby("State")["Amount"].sum().reset_index()

    # Create a pie chart to visualize region-wise performance
    chart = (
        alt.Chart(region_performance)
        .mark_arc()
        .encode(
            theta=alt.Theta(field="Amount", type="quantitative"),
            color=alt.Color(field="State", type="nominal"),
            tooltip=["State", "Amount"],
        )
        .properties(title="Region-wise Performance")
    )

    display(chart)
  configuration: {}
- type: PYTHON
  name: plot_category_distribution
  uuid: 22b7f1be-5660-4fe8-8003-020362345e17
  source: |-
    import altair as alt
    import pandas as pd

    # Group data by category to analyze category-wise distribution
    category_distribution = df_cleaned["Category"].value_counts().reset_index()
    category_distribution.columns = ["Category", "Count"]

    # Create a bar chart to visualize the category distribution
    chart = (
        alt.Chart(category_distribution)
        .mark_bar()
        .encode(
            x=alt.X("Category:N", title="Category"),
            y=alt.Y("Count:Q", title="Count"),
            tooltip=["Category", "Count"],
        )
        .properties(title="Distribution of Categories")
    )

    display(chart)
